/* ---- LOGIKA STEROWANIA MOBILNEGO (DYNAMIC DUAL-TOUCH) ---- */
let touchMode=false,touchVector={x:0,y:0},touchShooting=false,touchAiming=false;
let joyLeftId=null,joyRightId=null,joyLeftStart={x:0,y:0};

const joyLeftEl=$('joy-left'),stickLeftEl=$('stick-left');
$('btn-dash').addEventListener('touchstart',e=>{e.preventDefault();dash()});
$('btn-pause').addEventListener('touchstart',e=>{e.preventDefault();if(st=='play')pause();else if(st=='pause')resume()});

window.addEventListener('touchstart',e=>{
  if(st!='play')return;
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    if(t.target.closest('.mob-btn-group')||t.target.closest('#ov'))continue;
    
    touchMode=true;
    if(t.clientX < W / 2 && joyLeftId===null){
      joyLeftId=t.identifier;
      joyLeftStart={x:t.clientX,y:t.clientY};
      joyLeftEl.style.left=t.clientX+'px';
      joyLeftEl.style.top=t.clientY+'px';
      joyLeftEl.style.display='block';
      stickLeftEl.style.transform='translate(-50%,-50%)';
    }else if(t.clientX >= W / 2 && joyRightId===null){
      joyRightId=t.identifier;
      touchShooting=true;
      touchAiming=true;
      p.ang=Math.atan2(t.clientY-p.y,t.clientX-p.x);
    }
  }
},{passive:false});

window.addEventListener('touchmove',e=>{
  if(st!='play')return;
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    if(t.identifier===joyLeftId){
      const dx=t.clientX-joyLeftStart.x,dy=t.clientY-joyLeftStart.y,dist=hy(dx,dy),maxR=45;
      const angle=Math.atan2(dy,dx),clampedDist=Math.min(dist,maxR);
      touchVector.x=(Math.cos(angle)*(clampedDist/maxR));
      touchVector.y=(Math.sin(angle)*(clampedDist/maxR));
      stickLeftEl.style.transform=`translate(${-50+Math.cos(angle)*clampedDist}%, ${-50+Math.sin(angle)*clampedDist}%)`;
    }else if(t.identifier===joyRightId){
      p.ang=Math.atan2(t.clientY-p.y,t.clientX-p.x);
    }
  }
},{passive:false});

const resetTouch=e=>{
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    if(t.identifier===joyLeftId){
      joyLeftId=null;
      touchVector={x:0,y:0};
      joyLeftEl.style.display='none';
    }else if(t.identifier===joyRightId){
      joyRightId=null;
      touchShooting=false;
      touchAiming=false;
    }
  }
};
window.addEventListener('touchend',resetTouch);
window.addEventListener('touchcancel',resetTouch);
